<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Temps a València</title>
<style>body{font-family:system-ui,sans-serif;max-width:900px;margin:auto;padding:24px;background:#f5f7fa;color:#17202a}h1{margin-bottom:4px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}.card{background:white;padding:16px;border-radius:14px;box-shadow:0 2px 10px #0001}.date{font-weight:700}.max{font-size:1.35rem;font-weight:700}.min{color:#607080}#status{margin:18px 0}</style>
</head><body><h1>Temps a València</h1><p>Previsió meteorològica actualitzada automàticament.</p><div id="status">Carregant previsió…</div><div id="forecast" class="grid"></div>
<script>
const url='https://api.open-meteo.com/v1/forecast?latitude=39.4699&longitude=-0.3763&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FMadrid&forecast_days=16';
fetch(url).then(r=>r.json()).then(d=>{document.getElementById('status').textContent='Previsió dels pròxims '+d.daily.time.length+' dies';document.getElementById('forecast').innerHTML=d.daily.time.map((x,i)=>`<div class="card"><div class="date">${new Date(x+'T12:00:00').toLocaleDateString('ca-ES',{weekday:'short',day:'numeric',month:'short'})}</div><div class="max">${Math.round(d.daily.temperature_2m_max[i])} °C</div><div class="min">mín. ${Math.round(d.daily.temperature_2m_min[i])} °C</div><div>Pluja: ${d.daily.precipitation_probability_max[i]??'—'}%</div></div>`).join('')}).catch(()=>document.getElementById('status').textContent='No s’ha pogut carregar la previsió.');
</script></body></html>
